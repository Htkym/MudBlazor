name: deploy-mudblazor-dev

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue every run instead of cancelling the running or pending one, because a cancelled run marks its commit as failed.
  queue: max

jobs:
  deploy-web-app:
    name: Deploy web app to dev.mudblazor.com
    if: ${{ github.repository_owner == 'MudBlazor' }}
    uses: MudBlazor/Workflows/.github/workflows/template-deploy-web-app.yml@9d8a2f909533abbf628883c3c60a9229b0f2d5c8 # main at 2026-10-29
    with:
      dotnet-version: 10.0.x
      web-app-name: mudblazor-dev
      project-directory: './src/MudBlazor.Docs.WasmHost'
    secrets:
      publish-profile: ${{ secrets.PUBLISH_MUDBLAZOR_DEV }}
